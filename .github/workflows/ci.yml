name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Samples, Lösungen und Startpunkte bauen
        run: |
          dotnet build ReactiveDotnet.slnx
          dotnet build exercises/Exercises.Start.Tests
          dotnet build exercises/Extras.Start.Tests
      - name: Samples und Lösungen testen
        run: dotnet test ReactiveDotnet.slnx --no-build
